<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SEEÜ – ROOT INDEX</title>

<style>
  body {
    background:#000;
    color:#0f0;
    font-family:monospace;
    padding:40px;
    text-align:center;
  }

  h1 {
    font-size:28px;
    animation:glow 2s infinite alternate;
  }

  @keyframes glow {
    from { text-shadow:0 0 5px #0f0; }
    to   { text-shadow:0 0 20px #0f0; }
  }

  button {
    background:#000;
    color:#0f0;
    border:1px solid #0f0;
    padding:12px 25px;
    margin:10px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
  }

  button:hover {
    background:#0f0;
    color:#000;
  }

  #output {
    margin-top:40px;
    font-size:18px;
    border:1px solid #0f0;
    padding:20px;
    width:80%;
    margin-left:auto;
    margin-right:auto;
    min-height:140px;
    white-space:pre;
  }
</style>
</head>

<body>

<h1>SEEÜ – ROOT INDEX</h1>

<!-- ALLE 4 TASTEN -->
<button id="btnAll">ALL</button>
<button id="btnIn">IN →</button>
<button id="btnOut">← OUT</button>
<button id="btnSet">SET</button>

<div id="output">SEEÜ bereit…</div>

<script>
// XML ROOT BLOCK (dein Input)
const rootXML = `
<index>
  <value>1.0</value>
  <origin>ROOT</origin>
  <mode>absolutum3</mode>
</index>

<view>3x3</view>
<start src="./root.yml"></start>
`;

// XML PARSER
function parseXML(xml){
    const parser = new DOMParser();
    return parser.parseFromString(xml, "text/xml");
}

const rootData = parseXML(rootXML);

// RESPO LIST (ALLE 4 + Erweiterung)
const voices = [
  "QI – Anfang",
  "Orbit – Bewegung",
  "Operatoren – Arbeit",
  "EVO – Veränderung",
  "RW – Zustand",
  "SL – Formung",
  "BK – Erinnerung",
  "OP – Handlung"
];

// PLAYER ENGINE
class SEEUE_PLAYER {
    constructor(list){
        this.list = list;
        this.index = 0;
    }

    current(){ return this.list[this.index]; }
    next(){ this.index = (this.index + 1) % this.list.length; return this.current(); }
    prev(){ this.index = (this.index - 1 + this.list.length) % this.list.length; return this.current(); }
    random(){ this.index = Math.floor(Math.random() * this.list.length); return this.current(); }
}

const player = new SEEUE_PLAYER(voices);

// OUTPUT
function show(text){
    document.getElementById("output").textContent = text;
}

// BUTTONS
document.getElementById("btnAll").onclick = () => {
    const mode = rootData.querySelector("mode").textContent;
    show("ROOT MODE:\n" + mode + "\n\nSEEÜ:\n" + player.current());
};

document.getElementById("btnIn").onclick  = () => show(player.next());
document.getElementById("btnOut").onclick = () => show(player.prev());
document.getElementById("btnSet").onclick = () => show(player.random());
</script>

</body>
</html>
