<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SEEÜ – Voice Picker</title>

<style>
  body {
    background:#000;
    color:#0f0;
    font-family:monospace;
    text-align:center;
    padding:40px;
  }
  #output {
    margin-top:40px;
    font-size:20px;
    border:1px solid #0f0;
    padding:20px;
    width:80%;
    margin-left:auto;
    margin-right:auto;
    min-height:120px;
  }
</style>
</head>

<body>

<h1>SEEÜ – Voice Picker</h1>

<button id="pickBtn">Pick Voice</button>

<div id="output">Bereit…</div>

<script>
const voices = [
  "QI – Anfang",
  "Orbit – Bewegung",
  "Operatoren – Arbeit",
  "EVO – Veränderung",
  "RW – Zustand",
  "SL – Formung",
  "BK – Erinnerung",
  "OP – Handlung"
];

document.getElementById("pickBtn").onclick = () => {
  const pick = voices[Math.floor(Math.random() * voices.length)];
  document.getElementById("output").textContent = pick;
};
</script>

</body>
</html>
